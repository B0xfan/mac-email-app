# Manual trigger only, on purpose: scripts/auto-commit.sh pushes to main every ~10 minutes, and a push
# trigger would burn the free GitHub minutes. Start a run with scripts/cloud-build.sh.
name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Release build
        run: swift build -c release
      - name: Assemble the app (same layout as scripts/build.sh; signed later on John's Mac)
        run: |
          set -euo pipefail
          APP="build/Audrey Mail.app"
          EXT="$APP/Contents/PlugIns/MailShare.appex"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$EXT/Contents/MacOS"
          cp "$(swift build -c release --show-bin-path)/MailApp" "$APP/Contents/MacOS/MailApp"
          cp scripts/Info.plist "$APP/Contents/Info.plist"
          cp scripts/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          test -s Manual/mail-manual.md   # the vault comparison cannot run here (no vault); scripts/cloud-build.sh checks before the run and install-cloud-build.sh checks the built app
          cp Manual/mail-manual.md "$APP/Contents/Resources/mail-manual.md"   # the in-app help (copy of the vault manual, scripts/sync-manual.sh)
          swiftc -O -parse-as-library -application-extension -target arm64-apple-macos14.0 -framework Cocoa -Xlinker -e -Xlinker _NSExtensionMain ShareExtension/ShareViewController.swift -o "$EXT/Contents/MacOS/MailShare"
          cp ShareExtension/Info.plist "$EXT/Contents/Info.plist"
          swiftc -O -target arm64-apple-macos14.0 ClaudeBridge/main.swift Sources/MailApp/MCP.swift -o "$APP/Contents/MacOS/AudreyMailClaude"
          ditto -c -k --keepParent "$APP" AudreyMail.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AudreyMail-app
          path: AudreyMail.zip
          retention-days: 3
          compression-level: 0
      # The self-test lives in the debug build only. A failing or non-compiling self-test must fail the run.
      - name: Self-test (result is in this log)
        timeout-minutes: 25
        run: |
          swift build
          .build/debug/MailApp --selftest
      # Pictures of the help window (drawn in a window that is never shown) and a check of the toolbar tips. Noor looks at the pictures. A blank picture or a failing tip check fails the run.
      - name: Help screens and toolbar tips
        timeout-minutes: 8
        run: |
          rc=0
          .build/debug/MailApp --tiptest || rc=1
          .build/debug/MailApp --helpshots help-shots || rc=1
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: help-shots
          path: help-shots
          retention-days: 3
          if-no-files-found: ignore
